<p>Howdy! Here's a list of awesome computer scientists. Do you know any others? Add to the list yourself.</p>

<form (submit)="addName()">
  <input [(ngModel)]="newName" name="newName" placeholder="Awesome Computer Scientist">
  <button type="submit">Add</button>
</form>

<label class="search">
  <input type="search" [(ngModel)]="searchTerm" name="searchTerm"
    placeholder="Search computer scientists" aria-label="Search computer scientists">
</label>

<ul>
  <li *ngFor="let name of filteredNames">{{ name }}</li>
</ul>
